name: axlink-simulator
services:
  channel:
    # Same immutable image as the audited Packet.NET interop configuration.
    image: ghcr.io/packethacking/net-sim@sha256:b28c357a0a019e454e1cbf672849d4bb9089b62bfdefed94d2d6d9d016791315
    command: ["-autostart"]
    volumes:
      - ./network.yaml:/etc/sim/network.yaml:ro,Z
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8100:8100"
      - "127.0.0.1:8101:8101"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&- && exec 3>&-"]
      interval: 2s
      timeout: 2s
      retries: 30
