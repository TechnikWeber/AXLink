# Two simulated AFSK1200 TNCs; no serial devices or real audio interfaces.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence
nodes:
  - id: a
    ports:
      - id: vhf
        modem:
          mode: afsk1200
        kiss_port: 8100
  - id: b
    ports:
      - id: vhf
        modem:
          mode: afsk1200
        kiss_port: 8101
links:
  - { from: a.vhf, to: b.vhf, loss_db: 10 }
  - { from: b.vhf, to: a.vhf, loss_db: 10 }
