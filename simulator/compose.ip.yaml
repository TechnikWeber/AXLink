name: axlink-ip-lab
services:
  channel:
    image: ghcr.io/packethacking/net-sim@sha256:b28c357a0a019e454e1cbf672849d4bb9089b62bfdefed94d2d6d9d016791315
    command: ["-autostart"]
    volumes:
      - ./network.yaml:/etc/sim/network.yaml:ro,Z
    networks: [lab]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&- && exec 3>&-"]
      interval: 2s
      timeout: 2s
      retries: 30
  a:
    build:
      context: .
      dockerfile: node.Dockerfile
      network: host
    image: axlink-ip-lab-node:local
    depends_on:
      channel:
        condition: service_healthy
    environment:
      STATION: a
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv4.ip_forward: 0
    volumes:
      - ../upstream/packet.net/src/Packet.Node/bin/Release/net10.0:/opt/pdn:ro,z
      - ../artifacts/m1/pdn-net:/opt/pdn-net:ro,z
    networks: [lab]
  b:
    image: axlink-ip-lab-node:local
    depends_on:
      channel:
        condition: service_healthy
    environment:
      STATION: b
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv4.ip_forward: 0
    volumes:
      - ../upstream/packet.net/src/Packet.Node/bin/Release/net10.0:/opt/pdn:ro,z
      - ../artifacts/m1/pdn-net:/opt/pdn-net:ro,z
    networks: [lab]
networks:
  lab:
    internal: true
