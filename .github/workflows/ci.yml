name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (tests, vet, cross-builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-builds
        run: |
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "build $target"
            GOOS=${target%/*} GOARCH=${target#*/} GOARM=6 CGO_ENABLED=0 go build -o /dev/null ./cmd/axlinkd
          done
      - name: Python checks of the v0.1 lab
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  lab:
    name: Lab (two stations, network namespaces, F4HWN model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu restricts them through AppArmor; the lab needs them, not root.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: ping, UDP and HTTP through the simulated channel
        run: |
          bash scripts/lab-netns.sh f4hwn
          bash scripts/lab-netns.sh f4hwn-ackmode

  windows:
    name: Windows (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  macos:
    name: macOS (tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
